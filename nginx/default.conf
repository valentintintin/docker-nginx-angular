server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_static on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Fichiers haches par Angular (ex: main-3QPLHKE6.js) : cache 1 mois
    location ~ "-[A-Z0-9]{8}\.(?:js|css|woff2?)$" {
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Medias non haches (images, polices, videos) : cache 7 jours, un fichier remplace sous le meme nom peut rester jusqu'a 7 jours
    location ~* \.(?:jpg|jpeg|gif|png|webp|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }

    # Tout le reste (index.html, images, json, routes Angular) : revalidation a chaque fois (ETag)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
